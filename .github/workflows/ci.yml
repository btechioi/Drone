name: Tests and firmware build
on:
  push:
  pull_request:
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Protocol and receiver tests
        run: |
          python firmware/tools/test_protocol.py
          python -m unittest discover -s firmware/tests -v
          g++ -std=c++11 -Wall -Wextra -Werror firmware/tests/test_arming_gate.cpp -o /tmp/test-arming-gate
          /tmp/test-arming-gate
  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'platformio==6.2.0' -r firmware/requirements.txt
      - run: git -C madflight apply ../firmware/patches/madflight-serial-crc.patch
      - run: pio run -e RP2350A
        working-directory: firmware
