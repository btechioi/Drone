;============================================================
; Drone firmware - Raspberry Pi Pico 2 (RP2350) + GY-87 10DOF
;
; Based on the madflight flight controller library.
;
;   UART0 (GPIO0 TX / GPIO1 RX) : RC control input  (madflight "SERIAL" rcl gizmo)
;   UART1 (GPIO8 TX / GPIO9 RX) : telemetry output (binary, CRC16 protected)
;   I2C0  (GPIO20 SDA / GPIO21 SCL) : GY-87 (MPU6050 + BMP280 + HMC5883L)
;
; Build:  pio run -e RP2350A
; Flash:  pio run -e RP2350A -t upload
;============================================================

[platformio]
default_envs = RP2350A

[env]
; The USB-CDC console (madflight CLI) runs at 115200 baud
monitor_speed = 115200
monitor_echo = yes

; Regenerate madflight's parameter header before every build, so that the
; library enums always match src/cfg/param.yaml
extra_scripts =
    pre:tools/pre_gen_param.py

build_flags =
    -D MF_DEBUG=0

;------------------------------------------------------------
; RP2040 / RP2350 base settings (see https://madflight.com)
;------------------------------------------------------------
[env_rp2_base]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board_build.core = earlephilhower
platform_packages = framework-arduinopico@https://github.com/earlephilhower/arduino-pico.git#6.0.0
build_flags =
    ${env.build_flags}
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS ; Required: madflight needs FreeRTOS

;------------------------------------------------------------
; Raspberry Pi Pico 2 (RP2350A, 30 GPIO)
;------------------------------------------------------------
[env:RP2350A]
extends = env_rp2_base
board = rpipico2
lib_deps =
    symlink://../madflight
